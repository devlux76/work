<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563EB">
  <meta name="description" content="A modern word processor for markdown and LaTeX documents">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Word">
  <title>Word - Markdown Word Processor</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/document.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github.min.css" id="hljs-theme">
</head>
<body>
  <div id="app">
    <div id="titlebar">
      <div id="titlebar-left">
        <button id="sidebar-toggle" title="Toggle Sidebar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <span id="app-name">Word</span>
      </div>
      <div id="titlebar-center">
        <span id="doc-title">Untitled</span>
        <span id="dirty-indicator" class="dirty-dot" style="display:none">●</span>
      </div>
      <div id="titlebar-right">
        <button id="darkmode-toggle" title="Toggle Dark Mode">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </div>
    <div id="menubar"></div>
    <div id="toolbar"></div>
    <div id="main-container">
      <div id="sidebar">
        <div id="sidebar-header">
          <span>Documents</span>
          <button id="new-doc-btn" title="New Document">+</button>
        </div>
        <div id="document-list"></div>
      </div>
      <div id="sidebar-resizer"></div>
      <div id="workspace">
        <div id="editor-pane">
          <div id="editor-container"></div>
        </div>
        <div id="pane-divider"></div>
        <div id="preview-pane">
          <div id="preview-content"></div>
        </div>
      </div>
    </div>
    <div id="statusbar">
      <span id="status-mode">Edit</span>
      <span class="status-sep">|</span>
      <span id="status-words">0 words</span>
      <span class="status-sep">|</span>
      <span id="status-chars">0 chars</span>
      <span class="status-sep">|</span>
      <span id="status-pos">Ln 1, Col 1</span>
      <span class="status-sep status-right-sep">|</span>
      <span id="status-zoom">100%</span>
    </div>
  </div>
  <script src="dist/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
